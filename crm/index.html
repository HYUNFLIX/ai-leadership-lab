<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객사 관리 - AI Leadership Lab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --primary:#6366f1; --primary-soft:#818cf8; --secondary:#a855f7;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --info:#38bdf8;
    --ink:#e2e8f0; --ink-soft:#94a3b8; --ink-mute:#64748b;
    --bg:#0a0e1a; --panel:rgba(255,255,255,.06); --panel-line:rgba(255,255,255,.12);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,sans-serif; background:var(--bg); color:var(--ink);
    line-height:1.6; min-height:100vh; word-break:keep-all;
  }
  button{font-family:inherit;}
  .hidden{display:none!important;}

  /* ── 로그인 ── */
  .login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000;}
  .login-box{width:min(380px,90vw);padding:2.2rem;border-radius:16px;background:var(--panel);
    border:1px solid var(--panel-line);backdrop-filter:blur(20px);}
  .login-box .logo{font-size:1.3rem;font-weight:800;margin-bottom:.3rem;}
  .login-box .logo span{background:linear-gradient(135deg,var(--primary-soft),var(--secondary));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .login-box .subtitle{font-size:.85rem;color:var(--ink-soft);margin-bottom:1.4rem;}
  .login-box form{display:flex;flex-direction:column;gap:.6rem;}
  .login-input{padding:.8rem 1rem;border-radius:10px;border:1px solid var(--panel-line);
    background:rgba(255,255,255,.05);color:var(--ink);font-size:.94rem;font-family:inherit;}
  .login-input:focus{outline:2px solid var(--primary);}
  .btn-login{padding:.85rem;border:none;border-radius:10px;background:var(--primary);color:#fff;
    font-weight:700;font-size:.95rem;cursor:pointer;}
  .btn-login:hover{background:#5558e6;}
  .login-error{margin-top:.8rem;font-size:.82rem;color:#fca5a5;display:none;}
  .login-error.show{display:block;}

  /* ── 레이아웃 ── */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.92);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--panel-line);padding:.9rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .topbar .brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);}
  .topbar .brand span{background:linear-gradient(135deg,var(--primary-soft),var(--secondary));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .topbar nav{display:flex;gap:.4rem;align-items:center;}
  .topbar nav a, .topbar nav button{font-size:.84rem;color:var(--ink-soft);text-decoration:none;
    padding:.45rem .8rem;border-radius:8px;border:none;background:none;cursor:pointer;}
  .topbar nav a:hover, .topbar nav button:hover{background:var(--panel);color:var(--ink);}
  .wrap{max-width:1200px;margin:0 auto;padding:1.6rem 1.5rem 5rem;}

  /* ── 파이프라인 요약 ── */
  .pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-bottom:1.4rem;}
  .pipe-card{padding:.9rem 1rem;border-radius:var(--radius);background:var(--panel);
    border:1px solid var(--panel-line);cursor:pointer;transition:.15s;text-align:center;}
  .pipe-card:hover,.pipe-card.on{border-color:var(--st,var(--primary));background:rgba(255,255,255,.09);}
  .pipe-card .n{font-size:1.5rem;font-weight:800;color:var(--st,#fff);}
  .pipe-card .l{font-size:.78rem;color:var(--ink-soft);}
  @media(max-width:720px){.pipeline{gap:.4rem;}
    .pipe-card{padding:.6rem .3rem;}.pipe-card .n{font-size:1.15rem;}.pipe-card .l{font-size:.66rem;}}

  /* ── 툴바 ── */
  .toolbar{display:flex;gap:.7rem;margin-bottom:1.1rem;flex-wrap:wrap;}
  .search{flex:1;min-width:220px;padding:.7rem 1rem;border-radius:10px;border:1px solid var(--panel-line);
    background:var(--panel);color:var(--ink);font-size:.9rem;font-family:inherit;}
  .search:focus{outline:2px solid var(--primary);}
  .btn-add{padding:.7rem 1.3rem;border:none;border-radius:10px;background:var(--primary);color:#fff;
    font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;}
  .btn-add:hover{background:#5558e6;}

  /* ── 고객 카드 그리드 ── */
  .clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.9rem;}
  .client-card{padding:1.1rem 1.2rem;border-radius:var(--radius);background:var(--panel);
    border:1px solid var(--panel-line);cursor:pointer;transition:.15s;}
  .client-card:hover{border-color:var(--primary-soft);transform:translateY(-2px);}
  .client-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;margin-bottom:.45rem;}
  .client-card h3{font-size:1rem;font-weight:700;}
  .client-card .contact{font-size:.82rem;color:var(--ink-soft);}
  .client-card .meta{display:flex;gap:.5rem;margin-top:.55rem;font-size:.75rem;color:var(--ink-mute);flex-wrap:wrap;}
  .badge{font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;white-space:nowrap;
    background:color-mix(in srgb,var(--st) 16%,transparent);color:var(--st);border:1px solid color-mix(in srgb,var(--st) 35%,transparent);}
  .tagchip{background:rgba(255,255,255,.07);border:1px solid var(--panel-line);border-radius:99px;padding:.1rem .55rem;}
  .empty{padding:3rem 1rem;text-align:center;color:var(--ink-soft);font-size:.9rem;grid-column:1/-1;}

  /* ── 모달 ── */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:500;
    display:none;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow-y:auto;}
  .modal-bg.open{display:flex;}
  .modal{width:min(560px,100%);border-radius:16px;background:#131829;border:1px solid var(--panel-line);
    padding:1.6rem;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal h2{font-size:1.1rem;margin-bottom:1.2rem;}
  .f-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
  @media(max-width:520px){.f-row{grid-template-columns:1fr;}}
  .f{margin-bottom:.9rem;}
  .f label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:.35rem;}
  .f input,.f select,.f textarea{width:100%;padding:.65rem .85rem;border-radius:9px;font-size:.9rem;
    border:1px solid var(--panel-line);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;}
  .f textarea{resize:vertical;min-height:70px;}
  .f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--primary);}
  .interests{display:flex;flex-wrap:wrap;gap:.45rem;}
  .interests label{display:inline-flex;cursor:pointer;font-size:.8rem;padding:.35rem .8rem;border-radius:99px;
    background:rgba(255,255,255,.05);border:1px solid var(--panel-line);color:var(--ink-soft);margin:0;font-weight:500;}
  .interests input{display:none;}
  .interests label:has(input:checked){background:rgba(99,102,241,.25);border-color:var(--primary-soft);color:#fff;}
  .modal-actions{display:flex;justify-content:space-between;gap:.7rem;margin-top:1.3rem;}
  .modal-actions .right{display:flex;gap:.7rem;margin-left:auto;}
  .btn{padding:.65rem 1.2rem;border-radius:9px;font-size:.88rem;font-weight:700;cursor:pointer;border:none;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:#5558e6;}
  .btn-ghost{background:none;border:1px solid var(--panel-line);color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink-soft);}
  .btn-danger{background:none;border:1px solid rgba(239,68,68,.4);color:#f87171;}
  .btn-danger:hover{background:rgba(239,68,68,.12);}

  /* ── 상세 강의 이력 ── */
  .detail-lectures{margin-top:1rem;border-top:1px solid var(--panel-line);padding-top:1rem;}
  .detail-lectures h4{font-size:.85rem;color:var(--ink-soft);margin-bottom:.5rem;}
  .dl-item{display:flex;justify-content:space-between;gap:.8rem;font-size:.83rem;padding:.35rem 0;
    border-bottom:1px dashed rgba(255,255,255,.07);}
  .dl-item .d{color:var(--ink-mute);white-space:nowrap;}

  /* ── 토스트 ── */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:9500;
    background:#1e2540;border:1px solid var(--panel-line);color:var(--ink);padding:.7rem 1.3rem;
    border-radius:10px;font-size:.87rem;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:rgba(239,68,68,.5);color:#fca5a5;}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo"><span>AI</span> Leadership Lab</div>
    <p class="subtitle">고객사 관리 (CRM)</p>
    <form id="loginForm" onsubmit="signInCognito(event)">
      <input type="email" id="loginEmail" class="login-input" placeholder="이메일" required autocomplete="username">
      <input type="password" id="loginPassword" class="login-input" placeholder="비밀번호" required autocomplete="current-password">
      <input type="password" id="loginNewPassword" class="login-input" placeholder="새 비밀번호 설정 (10자 이상)" autocomplete="new-password" style="display:none;">
      <button class="btn-login" id="loginBtn" type="submit">로그인</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 메인 -->
<div id="mainContent" style="display:none;">
  <div class="topbar">
    <a class="brand" href="/"><span>AI</span> CRM</a>
    <nav>
      <a href="/lectures.html">강의 이력</a>
      <button onclick="signOutUser()">로그아웃</button>
    </nav>
  </div>

  <div class="wrap">
    <div class="pipeline" id="pipeline"></div>

    <div class="toolbar">
      <input type="search" class="search" id="searchInput" placeholder="회사명·담당자 검색…">
      <button class="btn-add" onclick="openModal()">+ 고객사 추가</button>
    </div>

    <div class="clients" id="clientList"></div>
  </div>
</div>

<!-- 추가/수정 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">고객사 추가</h2>
    <form id="clientForm" onsubmit="saveClient(event)">
      <div class="f-row">
        <div class="f"><label>회사명 *</label><input type="text" id="fCompany" required></div>
        <div class="f"><label>상태</label>
          <select id="fStatus">
            <option value="lead">잠재고객</option>
            <option value="proposal">제안중</option>
            <option value="negotiation">협상중</option>
            <option value="contract">계약완료</option>
            <option value="lost">실패</option>
          </select>
        </div>
      </div>
      <div class="f-row">
        <div class="f"><label>담당자명</label><input type="text" id="fContactName"></div>
        <div class="f"><label>직책</label><input type="text" id="fContactTitle"></div>
      </div>
      <div class="f-row">
        <div class="f"><label>전화번호</label><input type="tel" id="fContactPhone"></div>
        <div class="f"><label>이메일</label><input type="email" id="fContactEmail"></div>
      </div>
      <div class="f"><label>관심 주제</label>
        <div class="interests" id="fInterests">
          <label><input type="checkbox" value="AI 리터러시"><span>AI 리터러시</span></label>
          <label><input type="checkbox" value="AI 리더십"><span>AI 리더십</span></label>
          <label><input type="checkbox" value="바이브코딩"><span>바이브코딩</span></label>
          <label><input type="checkbox" value="디지털 전환"><span>디지털 전환</span></label>
          <label><input type="checkbox" value="조직문화"><span>조직문화</span></label>
          <label><input type="checkbox" value="코칭"><span>코칭</span></label>
        </div>
      </div>
      <div class="f"><label>메모</label><textarea id="fMemo"></textarea></div>

      <div class="detail-lectures hidden" id="detailLectures">
        <h4>이 고객사 강의 이력</h4>
        <div id="detailLectureList"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger hidden" id="deleteBtn" onclick="deleteClient()">삭제</button>
        <div class="right">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">취소</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ================ AWS 설정 (lectures.html과 토큰 공유) ================
  const API_URL = 'https://tnibst6km5.execute-api.ap-northeast-2.amazonaws.com/prod';
  const COGNITO_URL = 'https://cognito-idp.ap-northeast-2.amazonaws.com/';
  const COGNITO_CLIENT_ID = '7dpeoqp3n1870th6u6qbsj09mu';
  const TOKEN_KEY = 'ailab_tokens';

  const STATUS = {
    lead:        { label: '잠재고객', color: '#94a3b8' },
    proposal:    { label: '제안중',   color: '#38bdf8' },
    negotiation: { label: '협상중',   color: '#f59e0b' },
    contract:    { label: '계약완료', color: '#10b981' },
    lost:        { label: '실패',     color: '#ef4444' },
  };

  let clients = [];
  let lectures = [];      // 고객사별 이력 표시용 (읽기 전용)
  let editingId = null;
  let statusFilter = null;

  // ================ 토큰/인증 ================
  function saveTokens(t) { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }
  function loadTokens() { try { return JSON.parse(localStorage.getItem(TOKEN_KEY)); } catch (e) { return null; } }
  function clearTokens() { localStorage.removeItem(TOKEN_KEY); }
  function parseJwt(t) {
    try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); }
    catch (e) { return {}; }
  }
  async function cognito(target, body) {
    const res = await fetch(COGNITO_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-amz-json-1.1', 'X-Amz-Target': 'AWSCognitoIdentityProviderService.' + target },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw data;
    return data;
  }
  async function refreshTokens() {
    const t = loadTokens();
    if (!t || !t.refreshToken) return false;
    try {
      const out = await cognito('InitiateAuth', { AuthFlow: 'REFRESH_TOKEN_AUTH', ClientId: COGNITO_CLIENT_ID, AuthParameters: { REFRESH_TOKEN: t.refreshToken } });
      const idToken = out.AuthenticationResult.IdToken;
      saveTokens({ idToken: idToken, refreshToken: t.refreshToken, exp: parseJwt(idToken).exp });
      return true;
    } catch (e) { clearTokens(); return false; }
  }
  async function getIdToken() {
    let t = loadTokens();
    if (!t) return null;
    if (t.exp && t.exp * 1000 < Date.now() + 60000) {
      if (!await refreshTokens()) return null;
      t = loadTokens();
    }
    return t.idToken;
  }
  async function api(path, opts) {
    opts = opts || {};
    const token = await getIdToken();
    if (!token) { showLogin(); throw new Error('로그인이 필요합니다'); }
    const res = await fetch(API_URL + path, Object.assign({}, opts, {
      headers: Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, opts.headers || {}),
    }));
    if (res.status === 401) {
      if (await refreshTokens()) return api(path, opts);
      showLogin();
      throw new Error('세션이 만료되었습니다');
    }
    if (!res.ok) throw new Error('API 오류 ' + res.status);
    return res.json();
  }

  function showLogin() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainContent').style.display = 'none';
  }
  function hideLogin() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainContent').style.display = 'block';
  }
  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }

  window.signInCognito = async function (e) {
    e.preventDefault();
    document.getElementById('loginError').classList.remove('show');
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const newPwEl = document.getElementById('loginNewPassword');
    btn.disabled = true;
    try {
      let out = await cognito('InitiateAuth', {
        AuthFlow: 'USER_PASSWORD_AUTH', ClientId: COGNITO_CLIENT_ID,
        AuthParameters: { USERNAME: email, PASSWORD: password },
      });
      if (out.ChallengeName === 'NEW_PASSWORD_REQUIRED') {
        if (newPwEl.style.display === 'none' || !newPwEl.value) {
          newPwEl.style.display = 'block';
          showLoginError('첫 로그인입니다. 새 비밀번호를 입력하고 다시 로그인을 누르세요.');
          return;
        }
        out = await cognito('RespondToAuthChallenge', {
          ClientId: COGNITO_CLIENT_ID, ChallengeName: 'NEW_PASSWORD_REQUIRED',
          Session: out.Session, ChallengeResponses: { USERNAME: email, NEW_PASSWORD: newPwEl.value },
        });
      }
      const idToken = out.AuthenticationResult.IdToken;
      saveTokens({ idToken: idToken, refreshToken: out.AuthenticationResult.RefreshToken, exp: parseJwt(idToken).exp });
      hideLogin();
      await boot();
    } catch (err) {
      const type = err.__type || '';
      if (type.indexOf('NotAuthorized') !== -1) showLoginError('이메일 또는 비밀번호가 올바르지 않습니다.');
      else showLoginError('로그인 실패: ' + (err.message || type || '오류'));
    } finally {
      btn.disabled = false;
    }
  };

  window.signOutUser = function () {
    clearTokens();
    clients = [];
    showLogin();
  };

  // ================ 데이터 ================
  async function boot() {
    try {
      const [c, l] = await Promise.all([api('/clients'), api('/lectures')]);
      clients = c.items || [];
      lectures = l.items || [];
      render();
    } catch (e) {
      toast('데이터 로드 실패: ' + e.message, true);
    }
  }

  function lectureCountFor(name) {
    if (!name) return 0;
    return lectures.filter(l => (l.client || '').trim() === name.trim()).length;
  }

  // ================ 렌더 ================
  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function render() {
    // 파이프라인 요약
    const pipe = document.getElementById('pipeline');
    pipe.innerHTML = Object.entries(STATUS).map(([key, s]) => {
      const n = clients.filter(c => c.status === key).length;
      return `<div class="pipe-card ${statusFilter === key ? 'on' : ''}" style="--st:${s.color}" onclick="toggleFilter('${key}')">
        <div class="n">${n}</div><div class="l">${s.label}</div></div>`;
    }).join('');

    // 목록
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = clients.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    if (statusFilter) list = list.filter(c => c.status === statusFilter);
    if (q) list = list.filter(c =>
      (c.companyName || '').toLowerCase().includes(q) ||
      (c.contactName || '').toLowerCase().includes(q));

    const el = document.getElementById('clientList');
    if (!list.length) {
      el.innerHTML = `<div class="empty">${clients.length ? '조건에 맞는 고객사가 없습니다.' : '아직 등록된 고객사가 없습니다.<br>+ 고객사 추가로 시작하세요.'}</div>`;
      return;
    }
    el.innerHTML = list.map(c => {
      const s = STATUS[c.status] || STATUS.lead;
      const cnt = lectureCountFor(c.companyName);
      return `<div class="client-card" onclick="openModal('${c.id}')">
        <div class="top">
          <h3>${esc(c.companyName)}</h3>
          <span class="badge" style="--st:${s.color}">${s.label}</span>
        </div>
        <div class="contact">${esc(c.contactName || '담당자 미등록')}${c.contactTitle ? ' · ' + esc(c.contactTitle) : ''}</div>
        <div class="meta">
          ${cnt ? `<span class="tagchip">강의 ${cnt}건</span>` : ''}
          ${(c.interests || []).slice(0, 3).map(i => `<span class="tagchip">${esc(i)}</span>`).join('')}
        </div>
      </div>`;
    }).join('');
  }

  window.toggleFilter = function (key) {
    statusFilter = statusFilter === key ? null : key;
    render();
  };
  document.getElementById('searchInput').addEventListener('input', render);

  // ================ 모달 ================
  window.openModal = function (id) {
    editingId = id || null;
    const c = id ? (clients.find(x => x.id === id) || {}) : {};
    document.getElementById('modalTitle').textContent = id ? '고객사 정보' : '고객사 추가';
    document.getElementById('fCompany').value = c.companyName || '';
    document.getElementById('fStatus').value = c.status || 'lead';
    document.getElementById('fContactName').value = c.contactName || '';
    document.getElementById('fContactTitle').value = c.contactTitle || '';
    document.getElementById('fContactPhone').value = c.contactPhone || '';
    document.getElementById('fContactEmail').value = c.contactEmail || '';
    document.getElementById('fMemo').value = c.memo || '';
    document.querySelectorAll('#fInterests input').forEach(cb => {
      cb.checked = (c.interests || []).includes(cb.value);
    });
    document.getElementById('deleteBtn').classList.toggle('hidden', !id);

    // 강의 이력
    const dl = document.getElementById('detailLectures');
    if (id && c.companyName) {
      const rows = lectures
        .filter(l => (l.client || '').trim() === c.companyName.trim())
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (rows.length) {
        dl.classList.remove('hidden');
        document.getElementById('detailLectureList').innerHTML = rows.slice(0, 8).map(l =>
          `<div class="dl-item"><span>${esc(l.name)}</span><span class="d">${esc(l.date)}</span></div>`
        ).join('') + (rows.length > 8 ? `<div class="dl-item"><span style="color:var(--ink-mute)">외 ${rows.length - 8}건</span></div>` : '');
      } else dl.classList.add('hidden');
    } else dl.classList.add('hidden');

    document.getElementById('modalBg').classList.add('open');
  };
  window.closeModal = function () {
    document.getElementById('modalBg').classList.remove('open');
  };
  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeModal();
  });

  window.saveClient = async function (e) {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    const payload = {
      companyName: document.getElementById('fCompany').value.trim(),
      status: document.getElementById('fStatus').value,
      contactName: document.getElementById('fContactName').value.trim(),
      contactTitle: document.getElementById('fContactTitle').value.trim(),
      contactPhone: document.getElementById('fContactPhone').value.trim(),
      contactEmail: document.getElementById('fContactEmail').value.trim(),
      memo: document.getElementById('fMemo').value.trim(),
      interests: [...document.querySelectorAll('#fInterests input:checked')].map(cb => cb.value),
    };
    try {
      if (editingId) await api('/clients/' + encodeURIComponent(editingId), { method: 'PUT', body: JSON.stringify(payload) });
      else await api('/clients', { method: 'POST', body: JSON.stringify(payload) });
      toast(editingId ? '수정되었습니다.' : '등록되었습니다.');
      closeModal();
      await boot();
    } catch (err) {
      toast('저장 실패: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  };

  window.deleteClient = async function () {
    if (!editingId) return;
    const c = clients.find(x => x.id === editingId);
    if (!confirm((c ? c.companyName : '') + ' 고객사를 삭제할까요?')) return;
    try {
      await api('/clients/' + encodeURIComponent(editingId), { method: 'DELETE' });
      toast('삭제되었습니다.');
      closeModal();
      await boot();
    } catch (err) {
      toast('삭제 실패: ' + err.message, true);
    }
  };

  // ================ 토스트 ================
  let toastTimer = null;
  function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ================ 초기화 ================
  (async function () {
    const token = await getIdToken();
    if (token) { hideLogin(); await boot(); }
    else showLogin();
  })();
</script>
